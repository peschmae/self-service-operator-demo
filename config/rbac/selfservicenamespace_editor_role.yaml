# This rule is not used by the project self-service-operator-2 itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the k8s.mpetermann.ch.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: self-service-operator-2
    app.kubernetes.io/managed-by: kustomize
  name: selfservicenamespace-editor-role
rules:
- apiGroups:
  - k8s.mpetermann.ch
  resources:
  - selfservicenamespaces
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - k8s.mpetermann.ch
  resources:
  - selfservicenamespaces/status
  verbs:
  - get
