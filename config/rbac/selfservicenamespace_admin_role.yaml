# This rule is not used by the project self-service-operator-2 itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over k8s.mpetermann.ch.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: self-service-operator-2
    app.kubernetes.io/managed-by: kustomize
  name: selfservicenamespace-admin-role
rules:
- apiGroups:
  - k8s.mpetermann.ch
  resources:
  - selfservicenamespaces
  verbs:
  - '*'
- apiGroups:
  - k8s.mpetermann.ch
  resources:
  - selfservicenamespaces/status
  verbs:
  - get
